<!DOCTYPE html>
<html>
<head>
    <title>VR Math: Demon Lord Phase</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        #setup-gui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: sans-serif; text-align: center; }
        .btn { padding: 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 10px; width: 80%; font-size: 20px; cursor: pointer; }
        #remote-ui { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #222; z-index: 1000; }
        #fire-btn { width: 100%; height: 100%; background: #ff3e3e; color: white; font-size: 40px; border: none; }
        input { padding: 15px; font-size: 20px; width: 70%; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="setup-gui">
        <div id="choice-step">
            <h1>VR MATH CONTROL</h1>
            <button class="btn" onclick="showScreenSetup()">BE THE SCREEN (VR)</button>
            <button class="btn" onclick="showRemoteSetup()">BE THE REMOTE</button>
        </div>
        <div id="screen-setup" style="display:none">
            <h2>ROOM CODE:</h2>
            <h1 id="display-code" style="color: #00FF00; font-size: 50px;">...</h1>
            <p>Enter this on the Remote phone.</p>
        </div>
        <div id="remote-setup" style="display:none">
            <h2>ENTER CODE:</h2>
            <input type="text" id="join-code" placeholder="Example: 1234">
            <button class="btn" onclick="initRemote()">CONNECT</button>
        </div>
    </div>

    <div id="remote-ui"><button id="fire-btn">TAP TO CHOOSE</button></div>

    <a-scene>
        <a-sky color="#050505"></a-sky>
        <a-entity camera look-controls position="0 1.6 0">
            <a-entity id="my-cursor" cursor="fuse: false" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03" material="color: #00FF00; shader: flat" raycaster="objects: .clickable"></a-entity>
        </a-entity>

        <a-entity id="start-menu" position="0 1.6 -3" visible="true">
            <a-text value="SELECT DIFFICULTY" position="0 1.2 0" align="center" width="6" color="#FF3E3E"></a-text>
            <a-entity class="clickable" id="easy" geometry="primitive: plane; width: 1.2; height: 0.5" material="color: #444" position="-1.5 0.5 0" onclick="setDifficulty('easy')"><a-text value="EASY" align="center"></a-text></a-entity>
            <a-entity class="clickable" id="medium" geometry="primitive: plane; width: 1.2; height: 0.5" material="color: #444" position="0 0.5 0" onclick="setDifficulty('medium')"><a-text value="MEDIUM" align="center"></a-text></a-entity>
            <a-entity class="clickable" id="hard" geometry="primitive: plane; width: 1.2; height: 0.5" material="color: #444" position="1.5 0.5 0" onclick="setDifficulty('hard')"><a-text value="HARD" align="center"></a-text></a-entity>
        </a-entity>

        <a-entity id="prep-screen" position="0 1.6 -3" visible="false">
            <a-text value="GET READY" position="0 0.8 0" align="center" width="8" color="#FFD700"></a-text>
            <a-text id="prep-timer-text" value="10" position="0 0.2 0" align="center" width="12" color="#FF4D4D"></a-text>
            <a-entity id="skip-btn" class="clickable" geometry="primitive: plane; width: 1; height: 0.4" material="color: #666" position="0 -0.8 0" onclick="skipPrep()">
                <a-text value="SKIP" align="center"></a-text>
            </a-entity>
        </a-entity>

        <a-entity id="game-elements" position="0 1.6 -3.5" visible="false">
            <a-text id="score-vr" value="PTS: 0" position="-0.8 1.8 0" width="4" align="center" color="#00FF00"></a-text>
            <a-text id="timer-vr" value="TIME: 20" position="0.8 1.8 0" width="4" align="center" color="#FFD700"></a-text>
            <a-text id="question-text" value="" position="0 1.2 0" align="center" width="7" color="#FFD700"></a-text>
            
            <a-entity id="opt0" class="ans-box" geometry="primitive: plane; width: 1.5; height: 0.7" material="color: #333" position="-0.9 0.3 0" onclick="checkAns(0)"><a-text id="txt0" value="-" align="center"></a-text></a-entity>
            <a-entity id="opt1" class="ans-box" geometry="primitive: plane; width: 1.5; height: 0.7" material="color: #333" position="0.9 0.3 0" onclick="checkAns(1)"><a-text id="txt1" value="-" align="center"></a-text></a-entity>
            <a-entity id="opt2" class="ans-box" geometry="primitive: plane; width: 1.5; height: 0.7" material="color: #333" position="-0.9 -0.6 0" onclick="checkAns(2)"><a-text id="txt2" value="-" align="center"></a-text></a-entity>
            <a-entity id="opt3" class="ans-box" geometry="primitive: plane; width: 1.5; height: 0.7" material="color: #333" position="0.9 -0.6 0" onclick="checkAns(3)"><a-text id="txt3" value="-" align="center"></a-text></a-entity>
        </a-entity>
    </a-scene>

    <script>
        let score = 0, questionsDone = 0, timeLeft = 20, currentAnswer;
        let difficulty = 'easy', timerInterval, prepInterval, isPlaying = false, hoveredElement = null, peer, conn;
        let opCycle = 0; // To track 2 add, 2 sub pattern

        // --- NETWORK REMOTE LOGIC ---
        function showScreenSetup() {
            const code = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('choice-step').style.display = 'none';
            document.getElementById('screen-setup').style.display = 'block';
            document.getElementById('display-code').innerText = code;
            peer = new Peer('math-vr-' + code);
            peer.on('connection', (c) => {
                document.getElementById('setup-gui').style.display = 'none';
                c.on('data', (data) => { if(data === 'CLICK' && hoveredElement) hoveredElement.click(); });
            });
        }

        function showRemoteSetup() { document.getElementById('choice-step').style.display = 'none'; document.getElementById('remote-setup').style.display = 'block'; }
        function initRemote() {
            const code = document.getElementById('join-code').value;
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect('math-vr-' + code);
                conn.on('open', () => { document.getElementById('setup-gui').style.display = 'none'; document.getElementById('remote-ui').style.display = 'block'; });
            });
            const sendClick = (e) => { e.preventDefault(); conn.send('CLICK'); };
            document.getElementById('fire-btn').addEventListener('touchstart', sendClick);
            document.getElementById('fire-btn').addEventListener('mousedown', sendClick);
        }

        // --- GAME FLOW ---
        function setDifficulty(mode) {
            difficulty = mode;
            document.getElementById('start-menu').setAttribute('visible', 'false');
            document.querySelectorAll('#start-menu .clickable').forEach(el => el.classList.remove('clickable'));
            startPrep();
        }

        function startPrep() {
            document.getElementById('prep-screen').setAttribute('visible', 'true');
            let pTime = 10;
            prepInterval = setInterval(() => {
                pTime--;
                document.getElementById('prep-timer-text').setAttribute('value', pTime);
                if(pTime <= 0) skipPrep();
            }, 1000);
        }

        function skipPrep() {
            clearInterval(prepInterval);
            document.getElementById('prep-screen').setAttribute('visible', 'false');
            document.getElementById('game-elements').setAttribute('visible', 'true');
            document.querySelectorAll('.ans-box').forEach(el => el.classList.add('clickable'));
            isPlaying = true;
            nextQuestion();
        }

        function generateMath() {
            let a, b, op;
            // Pattern: 0,1 = Add | 2,3 = Sub
            op = (opCycle < 2) ? '+' : '-';
            opCycle = (opCycle + 1) % 4;

            if (difficulty === 'easy') { a = Math.floor(Math.random()*9)+1; b = Math.floor(Math.random()*9)+1; }
            else if (difficulty === 'medium') { a = Math.floor(Math.random()*45)+5; b = Math.floor(Math.random()*15)+1; }
            else { a = Math.floor(Math.random()*80)+20; b = Math.floor(Math.random()*80)+20; }

            if (op === '-' && a < b) [a, b] = [b, a];
            currentAnswer = (op === '+') ? a + b : a - b;
            document.querySelector('#question-text').setAttribute('value', `${a} ${op} ${b}`);

            let answers = [currentAnswer];
            while(answers.length < 4) {
                let wrong = currentAnswer + (Math.floor(Math.random()*11)-5);
                if(!answers.includes(wrong) && wrong >= 0 && wrong !== currentAnswer) answers.push(wrong);
            }
            answers.sort(() => Math.random() - 0.5); // Randomize position
            for(let i=0; i<4; i++) {
                document.querySelector(`#txt${i}`).setAttribute('value', answers[i]);
                document.querySelector(`#opt${i}`).setAttribute('data-val', answers[i]);
            }
        }

        function checkAns(idx) {
            if(!isPlaying) return;
            const sel = parseInt(document.querySelector(`#opt${idx}`).getAttribute('data-val'));
            if(sel === currentAnswer) {
                score += (questionsDone < 7) ? 1 : (questionsDone < 12) ? 8 : 10;
                questionsDone++;
                document.querySelector('#score-vr').setAttribute('value', "PTS: " + score);
                if(questionsDone >= 14) endGame("VICTORY!"); else nextQuestion();
            } else { endGame("WRONG ANSWER!"); }
        }

        function nextQuestion() {
            // Three Phase Timer
            if(questionsDone < 7) timeLeft = 20;
            else if(questionsDone < 12) timeLeft = 10;
            else timeLeft = 5;

            document.querySelector('#timer-vr').setAttribute('value', "TIME: " + timeLeft);
            generateMath();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(!isPlaying) return;
                timeLeft--;
                document.querySelector('#timer-vr').setAttribute('value', "TIME: " + timeLeft);
                if(timeLeft <= 0) endGame("TIME EXPIRED!");
            }, 1000);
        }

        function endGame(msg) {
            isPlaying = false;
            clearInterval(timerInterval);
            alert(msg + "\nScore: " + score);
            location.reload();
        }

        // HOVER SYSTEM
        document.addEventListener('mouseenter', (e) => {
            if (e.target.classList.contains('clickable') || e.target.classList.contains('ans-box')) {
                hoveredElement = e.target;
                document.getElementById('my-cursor').setAttribute('material', 'color', '#FF0000');
            }
        }, true);
        document.addEventListener('mouseleave', () => {
            hoveredElement = null;
            document.getElementById('my-cursor').setAttribute('material', 'color', '#00FF00');
        }, true);
    </script>
</body>
</html>
